name: Deploy site previews to GitHub Pages

on:
  push:
    branches: [claude/last-30-days-report-0dy8z0]
    paths:
      - "projects/edge-waypoint/site/**"
      - "projects/edge-waypoint/site-c-sketchbook/**"
      - "projects/edge-waypoint/site-a-gallery/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble preview site
        run: |
          mkdir -p _site
          cp -r projects/edge-waypoint/site            _site/field-guide
          cp -r projects/edge-waypoint/site-c-sketchbook _site/sketchbook
          cp -r projects/edge-waypoint/site-a-gallery    _site/gallery
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="robots" content="noindex, nofollow">
            <title>Edge Waypoint - design previews</title>
            <style>
              body { font-family: "IBM Plex Mono", monospace; background: #141414; color: #fff;
                     max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.7; }
              h1 { font-size: 1.2rem; letter-spacing: 0.1em; text-transform: uppercase; }
              h1::before { content: ""; display: inline-block; width: 0.8rem; height: 1.2rem;
                           background: #FF5200; margin-right: 0.6rem; vertical-align: -0.15em; }
              a { color: #FF5200; }
              li { margin-bottom: 0.8rem; }
              .note { opacity: 0.6; font-size: 0.85rem; margin-top: 2.5rem; }
            </style>
          </head>
          <body>
            <h1>Edge Waypoint - previews</h1>
            <ul>
              <li><a href="sketchbook/">Variant C - Sketchbook Journey</a><br>cream paper, hand-drawn, handwritten margin notes</li>
              <li><a href="gallery/">Variant A - Gallery Print</a><br>white monograph, artwork as captioned plates</li>
              <li><a href="field-guide/">Variant v1 - Field Guide</a><br>the original: print-shop crisp, no external art needed</li>
            </ul>
            <p class="note">Unlisted preview. Sketchbook and Gallery show broken image slots until the five art PNGs are committed to their assets/art/ folders.</p>
          </body>
          </html>
          HTML
          # keep the art folder READMEs out of the published site
          rm -f _site/*/assets/art/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
