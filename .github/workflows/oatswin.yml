name: OatsWin

on:
  push:
    paths: ["projects/oatswin/**", ".github/workflows/oatswin.yml"]
  pull_request:
    paths: ["projects/oatswin/**", ".github/workflows/oatswin.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/oatswin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: OatsWin-win-x64
          path: projects/oatswin/dist/OatsWin-win-x64/
          retention-days: 30
